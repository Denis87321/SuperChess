# Render Blueprint
# - Web Service: matchmaking WebSocket
# - Static Site: Flutter web (prebuilt in /public — no Flutter on Render)

services:
  - type: web
    name: superchess-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health

  - type: web
    name: superchess-web
    runtime: static
    plan: free
    region: frankfurt
    # Prebuilt Flutter web in /public (Render has no Flutter SDK).
    buildCommand: "echo Using prebuilt public/"
    staticPublishPath: ./public
