# Render Blueprint
# - Postgres: accounts
# - Web Service: matchmaking WebSocket + auth HTTP
# - Static Site: Flutter web (prebuilt in /public)

databases:
  - name: superchess-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: superchess-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: superchess-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: superchess-web
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: "echo Using prebuilt public/"
    staticPublishPath: ./public
